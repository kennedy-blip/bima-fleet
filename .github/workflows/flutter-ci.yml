name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web,android --project-name bima_fleet .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /
  android-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name bima_fleet .
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BimaFleet-latest
          name: BimaFleet latest Android build
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: Automated BimaFleet Android release. Download app-release.apk and install on a compatible Android device.
